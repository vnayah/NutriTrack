<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriTrack - Contact</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="contact.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="nav-brand">
            🥗 NutriTrack
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <a href="contact.html" aria-current="page">Contact</a>
            <button type="button" id="logoutBtn" class="logout-btn">
                Logout
            </button>
        </div>
    </nav>

    <main class="contact-container">
        <section class="contact-card">
            <header class="page-heading">
                <h1>Contact Us</h1>
                <p>
                    Have a question or feedback?
                    Send us a message.
                </p>
            </header>

            <form id="contactForm">

                <label for="contactName">Your Name</label>
                <input
                    type="text"
                    id="contactName"
                    name="name"
                    placeholder="Enter your name"
                    maxlength="100"
                    autocomplete="name"
                    required
                >

                <label for="contactEmail">Email Address</label>
                <input
                    type="email"
                    id="contactEmail"
                    name="email"
                    placeholder="Enter your email"
                    maxlength="254"
                    autocomplete="email"
                    required
                >

                <label for="contactMessage">Your Message</label>
                <textarea
                    id="contactMessage"
                    name="message"
                    placeholder="Write your message here..."
                    rows="6"
                    maxlength="3000"
                    required
                ></textarea>

                <p
                    id="contactError"
                    class="error"
                    role="alert"
                    aria-live="polite"
                ></p>

                <p
                    id="emailStatus"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="contactSubmitBtn"
                    class="primary-btn"
                >
                    Send Message
                </button>

            </form>
        </section>
    </main>

    <footer class="footer">
        <p>
            Track your food, monitor your nutrition, and stay healthy.
        </p>
        <p>&copy; 2026 NutriTrack. All rights reserved.</p>
    </footer>

</body>
</html>
